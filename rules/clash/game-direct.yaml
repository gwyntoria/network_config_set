# NAME: Game
# POLICY: direct
# SOURCE: https://github.com/gwyntoria/network_config_set/blob/main/rules/clash/game-direct.yaml
# UPDATED: 2026-11-23
# DOMAIN: 22
# DOMAIN-SUFFIX: 25
# DOMAIN-REGEX: 2
# TOTAL: 49
payload:
  # Steam China - Platform
  - DOMAIN-SUFFIX,steamchina.com

  # Steam China - Download CDN（实测直连 17-26ms，代理 86-783ms）
  - DOMAIN,dl.steam.clngaa.com
  - DOMAIN,st.dl.bscstorage.net
  - DOMAIN,st.dl.eccdnx.com
  - DOMAIN,xz.pphimalayanrt.com

  # Steam - 下载协商与控制通道（api 决定下发哪套内容服务器，必须直连）
  - DOMAIN-SUFFIX,api.steampowered.com
  - DOMAIN-SUFFIX,cdn.steampowered.com
  - DOMAIN-SUFFIX,client-download.steampowered.com
  - DOMAIN-SUFFIX,media.steampowered.com

  # Steam - 内容 CDN（国内内容服务器）
  - DOMAIN-SUFFIX,cm.steampowered.com
  - DOMAIN-SUFFIX,steamcontent.com
  - DOMAIN-SUFFIX,steamserver.net

  # Steam - 客户端更新（批量；其余 steamstatic 资源见 game-proxy）
  - DOMAIN,cdn.steamstatic.com
  - DOMAIN,client-update.steamstatic.com
  - DOMAIN,client-update.akamai.steamstatic.com
  - DOMAIN,client-update.fastly.steamstatic.com

  # Steam - 用户内容 CDN
  - DOMAIN-SUFFIX,steamusercontent.com

  # Steam - 第三方状态站（实测直连 617ms，代理 667-3609ms）
  - DOMAIN,steamstat.us

  # Epic Games - 平台后端 API（实测直连 240-300ms，与代理相当且更稳定）
  - DOMAIN-SUFFIX,ol.epicgames.com
  - DOMAIN-SUFFIX,on.epicgames.com
  - DOMAIN-SUFFIX,epicgames.dev
  - DOMAIN,tracking.epicgames.com

  # Epic Games - 下载与内容 CDN（实测直连 1.4-2.1MB/s，代理 0.3-0.7MB/s 且偶发 TLS 失败）
  - DOMAIN,download.epicgames.com
  - DOMAIN,launcher.epicgames.com
  - DOMAIN,cdn1.epicgames.com
  - DOMAIN,cdn2.epicgames.com
  - DOMAIN,cdn1.unrealengine.com
  - DOMAIN,cdn2.unrealengine.com
  - DOMAIN,epicgames-download1.akamaized.net
  - DOMAIN-SUFFIX,epicgamescdn.com
  - DOMAIN-REGEX,^epicgames-download\d+-\d+\.file\.myqcloud\.com$
  - DOMAIN-REGEX,^cdn\d+-epicgames-\d+\.file\.myqcloud\.com$

  # Epic Games - 网页与静态资源（实测直连中位数不劣于代理）
  - DOMAIN,epicgames.com
  - DOMAIN,www.epicgames.com
  - DOMAIN,static-assets-prod.epicgames.com
  - DOMAIN,dev.epicgames.com

  # Epic Games - Anti-Cheat
  - DOMAIN-SUFFIX,eac-cdn.com
  - DOMAIN-SUFFIX,easy.ac
  - DOMAIN-SUFFIX,easyanticheat.net

  # Epic Games - 帮助站点
  - DOMAIN-SUFFIX,helpshift.com

  # Epic Games - Titles
  - DOMAIN-SUFFIX,battlebreakers.com
  - DOMAIN-SUFFIX,fortnite.com
  - DOMAIN-SUFFIX,paragon.com
  - DOMAIN-SUFFIX,playparagon.com
  - DOMAIN-SUFFIX,roborecall.com
  - DOMAIN-SUFFIX,shadowcomplex.com
  - DOMAIN-SUFFIX,spyjinx.com

  # Ubisoft - Download CDN
  - DOMAIN,uplaypc-s-ubisoft.cdn.ubi.com

