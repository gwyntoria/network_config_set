// ==UserScript==
// @ScriptName        哔哩哔哩去广告
// @Author            @ddgksf2013, @blackmatrix7, @app2smile, @yjqiang, @kokoryh, @Maasea, @BiliUniverse
// @ScriptURL         https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/rewrite/bilibili.conf
// ==/UserScript==

hostname = app.bilibili.com, api.bilibili.com, api.biliapi.com, api.bilibili.net, api.biliapi.net, api.live.bilibili.com, grpc.biliapi.net

# 播放页广告
^https?:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive(?:\?|$) url reject-dict
^https?:\/\/api\.bilibili\.com\/x\/vip\/ads\/material\/report(?:\?|$) url reject-dict
^https:\/\/api\.bilibili\.com\/pgc\/season\/player\/cards(?:\?|$) url reject-dict
^https?:\/\/api\.bili(api|bili)\.(net|com)\/pgc\/season\/app\/related\/recommend\? url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/bilibili_json.js

# 直播购物广告
^https?:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v\d\/ecommerce-user\/get_shopping_info\? url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/bilibili_json.js
^https?:\/\/api\.live\.bilibili\.com\/xlive\/app-room\/v1\/index\/getInfoByRoom(?:\?|$) url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/bilibili_json.js

# 开屏广告
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/show(?:\?|$) url reject-dict
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list(?:\?|$) url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/bilibili_json.js

# 推荐流广告
^https?:\/\/app\.bilibili\.com\/x\/v2\/feed\/index(?:\/story)?(?:\?|$) url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/bilibili_json.js

# 我的页面会员购入口
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/mine(?:\?|$) url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/bilibili_json.js

# 搜索、播放页和动态广告
^https?:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.polymer\.app\.search\.v1\.Search\/SearchAll$ url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/response.bundle.js
^https?:\/\/(app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.(view|viewunite)\.v1\.View\/(View|TFInfo)$ url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/response.bundle.js
^https?:\/\/(app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.dynamic\.v2\.Dynamic\/DynAll$ url script-response-body https://raw.githubusercontent.com/gwyntoria/network_config_set/refs/heads/main/scripts/response.bundle.js
